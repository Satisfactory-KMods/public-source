[AccessTransformers]
; Stack-size CDO fixup: mirrors KBFL's UKBFLCDOItemStackSize — after writing mStackSize the cached
; numeric size must be refreshed from UFGResourceSettings::mStackSizes (both fields are protected).
Friend = (Class="UFGItemDescriptor", FriendClass="FKDFPatchUtil")

; `type: resourcenode` purges. Friendship is per-FriendClass — KBFL's equivalent entries do not
; transfer, and calling into KBFL instead would add a plugin dependency KDataForge does not have.
; mScannableResourcesPairs is private and is the only live scannable-resource list (the public
; RemoveAllScannableResources() clears the deprecated, non-replicated one).
Friend = (Class="AFGUnlockSubsystem", FriendClass="UKDFResourceNodeSubsystem")
; mNodeClusters / mNodeClustersUpToDate / GenerateNodeClusters() are protected; the cluster cache
; holds raw pointers to the destroyed nodes and has to be rebuilt.
Friend = (Class="AFGResourceScanner", FriendClass="UKDFResourceNodeSubsystem")
; No AFGResourceNodeBase entry: the node's own protected GetMeshActor() / mMeshActor soft pointer is
; deliberately NOT used (its soft-path remapping is not set up on hand-streamed World Partition
; sublevels — reading it can crash and Get() never resolves the in-world instance). The mesh actor is
; found through AFGNodeMeshActor::mNodeActor, which is public, and by proximity.

; `remove:` on a `type: recipe` document. mAvailableCustomizationRecipes / its lookup and the two
; FULL rebuild helpers (RebuildDerivedAvailableRecipesData / RebuildAvailableItemDescriptorLookup)
; are all private. RemoveAvailableRecipes itself is public. Friendship is per-FriendClass, so KBFL's
; equivalent entry does not transfer — and neither would a lambda or a free function, which is why
; the sweep stays a static member of this named class. Nothing is needed for AFGSchematicManager or
; AFGResearchManager — those go through SML's public RemoveSchematic / RemoveResearchTree.
Friend = (Class="AFGRecipeManager", FriendClass="FKDFRecipeRemoval")
